name: Budget App CI/CD

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**' # Only trigger if backend code changes
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: budget_app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        env:
          # This overrides your localhost settings in application.properties
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/budget_app_db
          DB_USER: postgres
          DB_PASSWORD: password
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Mocking the Gemini key for tests if your service bean loads it
          GEMINI_API_KEY: "test_key"
        run: mvn test -pl backend # Run tests specifically in the backend folder

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend # Points to your backend subfolder
          file: ./backend/Dockerfile # Points to the Dockerfile inside that folder
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/budget-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/budget-api:v1.0.${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}