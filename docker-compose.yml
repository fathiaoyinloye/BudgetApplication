services:
  budget_app_db:
    image: postgres:15-alpine
    container_name: budget-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-budget_app_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: budget-api
    ports:
      - "8080:8080"
    environment:
      # Use 'db' (the service name) instead of localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://budget_app_db:5432/${DB_NAME:-budget_app_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}

      # Security and API Keys
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL}

      # Senior Tip: Force console colors in Docker logs
      SPRING_OUTPUT_ANSI_ENABLED: ALWAYS
    depends_on:
      budget_app_db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: budget-frontend
    ports:
      - "80:80"
    environment:
      # If your frontend needs to know where the API is
      REACT_APP_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend

volumes:
  pgdata: